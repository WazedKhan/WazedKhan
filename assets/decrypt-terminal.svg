<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <!-- terminal window -->
  <rect x="1" y="1" width="598" height="178" rx="8" fill="#0d1117" stroke="#00ff9d" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="598" height="28" rx="8" fill="#161b22"/>
  <rect x="1" y="21" width="598" height="8" fill="#161b22"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="15" r="5" fill="#27c93f"/>
  <text x="300" y="19" font-family="'Courier New', monospace" font-size="12" fill="#8892b0" text-anchor="middle">wajed@classified: ~</text>

  <!-- line 1: typewriter reveal via clip-path -->
  <clipPath id="clip1">
    <rect x="0" y="0" width="0" height="24">
      <animate attributeName="width" from="0" to="400" begin="0.3s" dur="1.3s" fill="freeze" calcMode="linear"/>
    </rect>
  </clipPath>
  <text x="20" y="65" font-family="'Courier New', monospace" font-size="15" fill="#00ff9d" clip-path="url(#clip1)">&gt; decrypting classified_intel.enc...</text>

  <!-- line 2: typewriter reveal via clip-path -->
  <clipPath id="clip2">
    <rect x="0" y="0" width="0" height="24">
      <animate attributeName="width" from="0" to="320" begin="2.1s" dur="1.0s" fill="freeze" calcMode="linear"/>
    </rect>
  </clipPath>
  <text x="20" y="95" font-family="'Courier New', monospace" font-size="15" fill="#00ff9d" clip-path="url(#clip2)">&gt; bypassing firewall... done</text>

  <!-- line 3: ACCESS GRANTED stamp + infinite blink -->
  <text x="20" y="135" font-family="'Courier New', monospace" font-size="19" font-weight="bold" fill="#00ff9d" opacity="0">
    &gt; ACCESS GRANTED
    <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.15s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0.1;1" keyTimes="0;0.55;0.75;1" dur="1.1s" begin="3.8s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor block, follows the same blink once granted -->
  <rect x="215" y="120" width="10" height="16" fill="#00ff9d" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.15s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0.1;1" keyTimes="0;0.55;0.75;1" dur="1.1s" begin="3.8s" repeatCount="indefinite"/>
  </rect>
</svg>
